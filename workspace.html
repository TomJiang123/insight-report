<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Codex 工作台</title>
<style>
  :root {
    --bg: #0b1219;
    --panel: #111d27;
    --panel-hi: #172633;
    --surface: #1a2c3a;
    --surface-hi: #1f3444;
    --border: rgba(100, 160, 200, .08);
    --border-hi: rgba(100, 180, 220, .2);
    --ink: #d6e6f0;
    --ink-dim: #7e9aaa;
    --ink-muted: #4d6a7a;
    --accent: #3dc9a0;
    --accent-dim: #259675;
    --amber: #f5b85a;
    --coral: #f57a6e;
    --blue: #5ab0e8;
    --purple: #a87dd8;
    --danger: #f55a5a;
    --radius: 10px;
    --radius-sm: 6px;
    --font: "Bahnschrift", "DIN Alternate", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --font-mono: "Cascadia Code", "Consolas", "SF Mono", monospace;
    --shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--ink-muted);border-radius:4px}
  .app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:52px 1fr;height:100vh}
  @media(max-width:820px){.app{grid-template-columns:1fr}}
  .header{grid-column:1/-1;display:flex;align-items:center;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);gap:14px;z-index:10}
  .logo{font-weight:700;font-size:17px}
  .logo span{color:var(--accent)}
  .header-nav{display:flex;gap:4px;margin-left:20px}
  .header-nav button{background:transparent;border:none;color:var(--ink-dim);padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:var(--font);transition:.15s;position:relative;font-weight:500}
  .header-nav button:hover{color:var(--ink);background:var(--surface)}
  .header-nav button.active{color:var(--accent)}
  .header-nav button.active::after{content:'';position:absolute;bottom:0;left:8px;right:8px;height:2px;background:var(--accent);border-radius:2px}
  .header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
  .header-right .time{font-size:13px;color:var(--ink-dim);font-family:var(--font-mono)}
  .sidebar{background:var(--panel);border-right:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .sidebar-section{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-muted);padding:16px 10px 6px;font-weight:600}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--ink-dim);font-size:13px;transition:.12s}
  .sidebar-item:hover{background:var(--surface);color:var(--ink)}
  .sidebar-item.active{background:var(--surface-hi);color:var(--ink)}
  .sidebar-item .ico{width:18px;text-align:center;font-size:15px}
  .sidebar-item .badge{margin-left:auto;background:var(--surface-hi);padding:1px 7px;border-radius:10px;font-size:11px;color:var(--ink-dim)}
  .main{overflow-y:auto;padding:20px 24px;background:var(--bg)}
  .page{display:none;animation:fadeIn .25s ease}
  .page.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .page-header{margin-bottom:20px}
  .page-header h1{font-size:22px;font-weight:600;margin-bottom:4px}
  .page-header p{color:var(--ink-dim);font-size:14px}
  .card-grid{display:grid;gap:14px}
  .cols-2{grid-template-columns:1fr 1fr}
  .cols-3{grid-template-columns:1fr 1fr 1fr}
  .cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
  @media(max-width:1000px){.cols-3,.cols-4{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:.15s}
  .card:hover{border-color:var(--border-hi)}
  .card-title{font-size:13px;color:var(--ink-dim);margin-bottom:8px;font-weight:500}
  .card-value{font-size:28px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.5px}
  .card-value.accent{color:var(--accent)}
  .card-value.amber{color:var(--amber)}
  .card-value.coral{color:var(--coral)}
  .card-value.blue{color:var(--blue)}
  .card-desc{font-size:12px;color:var(--ink-muted);margin-top:4px}
  .todo-input{display:flex;gap:8px;margin-bottom:14px}
  .todo-input input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--ink);font-size:14px;font-family:var(--font);outline:none;transition:.12s}
  .todo-input input:focus{border-color:var(--accent)}
  .todo-input button,.btn{background:var(--accent);border:none;color:#000;padding:10px 18px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:13px;font-family:var(--font);transition:.12s}
  .todo-input button:hover,.btn:hover{background:var(--accent-dim)}
  .todo-list{list-style:none;display:flex;flex-direction:column;gap:4px}
  .todo-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;transition:.1s;font-size:14px}
  .todo-item:hover{background:var(--surface-hi)}
  .todo-item.done .todo-text{text-decoration:line-through;color:var(--ink-muted)}
  .todo-item .cb{width:18px;height:18px;border-radius:4px;border:2px solid var(--ink-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;font-size:11px;color:transparent}
  .todo-item.done .cb{background:var(--accent);border-color:var(--accent);color:#000}
  .todo-item .del-btn{margin-left:auto;background:transparent;border:none;color:var(--ink-muted);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;opacity:0;transition:.12s}
  .todo-item:hover .del-btn{opacity:1}
  .todo-item .del-btn:hover{color:var(--danger);background:rgba(245,90,90,.12)}
  .todo-empty{color:var(--ink-muted);font-size:14px;text-align:center;padding:30px}
  .notes-list{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
  .note-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;transition:.1s}
  .note-item:hover{background:var(--surface-hi)}
  .note-item.active{background:var(--surface-hi);border-left:3px solid var(--accent)}
  .note-item .note-date{font-size:11px;color:var(--ink-muted);margin-left:auto}
  .note-editor textarea{width:100%;min-height:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;color:var(--ink);font-size:14px;font-family:var(--font-mono);resize:vertical;outline:none;transition:.12s}
  .note-editor textarea:focus{border-color:var(--accent)}
  .note-editor .note-tools{display:flex;gap:8px;margin-top:8px}
  .btn-sm{padding:7px 14px;font-size:12px}
  .prompt-grid{display:grid;gap:10px}
  .prompt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:.12s}
  .prompt-card:hover{background:var(--surface-hi);border-color:var(--border-hi)}
  .prompt-card .prompt-name{font-weight:600;font-size:14px;margin-bottom:4px}
  .prompt-card .prompt-desc{font-size:12px;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prompt-card .prompt-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .prompt-card .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--surface-hi);color:var(--ink-dim);font-weight:500}
  .prompt-card .tag.green{background:rgba(61,201,160,.12);color:var(--accent)}
  .prompt-card .tag.blue{background:rgba(90,176,232,.12);color:var(--blue)}
  .prompt-card .tag.amber{background:rgba(245,184,90,.12);color:var(--amber)}
  .prompt-card .tag.purple{background:rgba(168,125,216,.12);color:var(--purple)}
  .prompt-detail{padding:14px;background:var(--surface);border-radius:var(--radius-sm);margin-top:10px}
  .prompt-detail pre{background:var(--bg);padding:14px;border-radius:var(--radius-sm);overflow-x:auto;font-family:var(--font-mono);font-size:13px;color:var(--ink);white-space:pre-wrap;margin-top:10px}
  .prompt-detail .copy-btn{background:var(--surface-hi);border:none;color:var(--ink-dim);padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-family:var(--font);transition:.12s;margin-top:8px}
  .prompt-detail .copy-btn:hover{background:var(--accent);color:#000}
  .timer-display{text-align:center;padding:30px 0}
  .timer-time{font-size:72px;font-weight:700;font-family:var(--font-mono);letter-spacing:2px;line-height:1}
  .timer-time.accent{color:var(--accent)}
  .timer-time.amber{color:var(--amber)}
  .timer-mode{font-size:14px;color:var(--ink-dim);margin-top:6px}
  .timer-controls{display:flex;gap:10px;justify-content:center;margin-top:20px}
  .timer-controls button{padding:10px 24px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:600;font-family:var(--font);transition:.12s}
  .timer-btn-start{background:var(--accent);color:#000}
  .timer-btn-start:hover{background:var(--accent-dim)}
  .timer-btn-stop{background:var(--danger);color:#fff}
  .timer-btn-stop:hover{background:#e04444}
  .timer-stats{display:flex;justify-content:center;gap:30px;margin-top:20px;color:var(--ink-dim);font-size:13px}
  .timer-stats span strong{color:var(--ink);font-weight:600}
  @media(max-width:820px){.sidebar{display:none}.header-nav button{padding:6px 10px;font-size:12px}.main{padding:14px}.timer-time{font-size:48px}}
</style>
</head>
<body><div class="app" id="app">
<header class="header"><div class="logo">⚡ <span>Codex</span> 工作台</div>
<nav class="header-nav" id="headerNav">
<button class="active" data-page="dashboard">📊 仪表盘</button>
<button data-page="tasks">✅ 任务</button>
<button data-page="notes">📝 笔记</button>
<button data-page="prompts">🤖 Prompts</button>
<button data-page="timer">⏱ 专注</button>
</nav>
<div class="header-right"><span class="time" id="clockDisplay">--:--:--</span></div>
</header>
<aside class="sidebar" id="sidebar">
<div class="sidebar-section">导航</div>
<div class="sidebar-item active" data-page="dashboard"><span class="ico">📊</span> 仪表盘</div>
<div class="sidebar-item" data-page="tasks"><span class="ico">✅</span> 任务<span class="badge" id="taskBadge">0</span></div>
<div class="sidebar-item" data-page="notes"><span class="ico">📝</span> 笔记</div>
<div class="sidebar-item" data-page="prompts"><span class="ico">🤖</span> Prompts</div>
<div class="sidebar-item" data-page="timer"><span class="ico">⏱</span> 专注</div>
<div style="margin-top:auto;border-top:1px solid var(--border);padding-top:10px"><div class="sidebar-item" id="sidebarReset"><span class="ico">🗑</span> 重置数据</div></div>
</aside>
<main class="main" id="mainContent">
<div class="page active" id="pageDashboard">
<div class="page-header"><h1>📊 仪表盘</h1><p id="greeting">欢迎回来</p></div>
<div class="card-grid cols-4">
<div class="card"><div class="card-title">待办任务</div><div class="card-value amber" id="statPending">0</div><div class="card-desc">未完成的任务</div></div>
<div class="card"><div class="card-title">今日完成</div><div class="card-value accent" id="statDone">0</div><div class="card-desc">今天已完成</div></div>
<div class="card"><div class="card-title">笔记总数</div><div class="card-value blue" id="statNotes">0</div><div class="card-desc">所有笔记</div></div>
<div class="card"><div class="card-title">专注次数</div><div class="card-value coral" id="statFocus">0</div><div class="card-desc">今日番茄钟</div></div>
</div>
<div class="card-grid cols-2" style="margin-top:14px">
<div class="card"><div class="card-title">📌 快速备忘</div><div class="todo-input" style="margin:0"><input type="text" id="quickNoteInput" placeholder="写点什么..."><button id="quickNoteBtn">记下</button></div><div id="quickNotesList" style="margin-top:10px"></div></div>
<div class="card"><div class="card-title">⏱ 专注计时</div><div style="text-align:center;padding:16px 0"><div style="font-size:42px;font-weight:700;font-family:var(--font-mono);letter-spacing:1px" id="dashTimer">25:00</div><div style="font-size:12px;color:var(--ink-dim);margin-top:4px">🍅 番茄钟</div><button class="btn" style="margin-top:10px" id="dashTimerBtn">开始</button></div></div>
</div>
</div>
<div class="page" id="pageTasks">
<div class="page-header"><h1>✅ 任务管理</h1><p>管理你的待办事项</p></div>
<div class="todo-input"><input type="text" id="taskInput" placeholder="添加新任务..."><button id="taskAddBtn">添加</button></div>
<div style="margin-bottom:10px;display:flex;gap:8px">
<button class="btn-sm" style="background:var(--surface);color:var(--ink-dim);border:none;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer" data-filter="all">全部</button>
<button class="btn-sm" style="background:var(--surface);color:var(--ink-dim);border:none;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer" data-filter="pending">待办</button>
<button class="btn-sm" style="background:var(--surface);color:var(--ink-dim);border:none;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer" data-filter="done">已完成</button>
<button class="btn-sm" style="background:var(--surface);color:var(--ink-dim);border:none;padding:6px 14px;border-radius:var(--radius-sm);cursor:pointer;margin-left:auto" id="clearDoneTasks">清除完成</button>
</div>
<ul class="todo-list" id="taskList"><li class="todo-empty">✨ 还没有任务，添加一个吧</li></ul>
</div>
<div class="page" id="pageNotes">
<div class="page-header"><h1>📝 笔记</h1><p>快速记录灵感与知识</p></div>
<div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn" id="newNoteBtn">+ 新建笔记</button></div>
<div style="display:grid;grid-template-columns:240px 1fr;gap:14px">
<div><div class="notes-list" id="notesList"></div></div>
<div class="note-editor"><textarea id="noteContent" placeholder="选择或新建笔记开始编辑..."></textarea><div class="note-tools"><span style="font-size:12px;color:var(--ink-muted)" id="noteInfo">未选择</span><button class="btn-sm" style="background:var(--surface-hi);color:var(--ink-dim);border:none;margin-left:auto;padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer" id="deleteNoteBtn">删除</button></div></div>
</div>
</div>
<div class="page" id="pagePrompts">
<div class="page-header"><h1>🤖 Prompt 库</h1><p>精选 AI 提示词模板</p></div>
<div class="prompt-grid" id="promptGrid"></div>
<div id="promptDetail"></div>
</div>
<div class="page" id="pageTimer">
<div class="page-header"><h1>⏱ 专注模式</h1><p>番茄工作法 · 保持专注</p></div>
<div style="max-width:400px;margin:0 auto">
<div class="timer-display"><div class="timer-time accent" id="timerDisplay">25:00</div><div class="timer-mode" id="timerMode">🍅 准备开始</div></div>
<div class="timer-controls"><button class="timer-btn-start" id="timerStartBtn">▶ 开始</button><button class="timer-btn-stop" id="timerResetBtn" style="background:var(--surface);color:var(--ink-dim)">↺ 重置</button></div>
<div class="timer-stats"><span>今日专注 <strong id="focusCount">0</strong> 次</span><span>总时长 <strong id="focusDuration">0</strong> 分钟</span></div>
</div>
</div>
</main>
</div>
<script>
(function(){
  'use strict';
  var K='codex_workspace',D,fL=function(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return{tasks:[],notes:[{id:'welcome',title:'欢迎',content:'# 欢迎使用 Codex 工作台!\n\n这是一个本地效率工具箱，所有数据都保存在你的浏览器中。\n\n## 功能\n- 任务管理\n- 笔记系统\n- Prompt 库\n- 番茄时钟\n\n开始使用吧!',updated:Date.now()}],focusCount:0,focusDuration:0,focusDate:(new Date()).toDateString(),quickNotes:[]}},sv=function(){localStorage.setItem(K,JSON.stringify(D));uI()};D=fL();if(D.focusDate!==(new Date()).toDateString()){D.focusCount=0;D.focusDuration=0;D.focusDate=(new Date()).toDateString();sv()}
  var cP='dashboard',cN=null,tF='all',tI=null,tR=25*60,tRn=false,tM='focus',FM=25,BM=5;
  function nav(p){cP=p;var c=p.charAt(0).toUpperCase()+p.slice(1);document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});document.getElementById('page'+c).classList.add('active');document.querySelectorAll('#headerNav button,.sidebar-item[data-page]').forEach(function(x){x.classList.toggle('active',x.dataset.page===p)});if(p==='tasks')rT();if(p==='notes')rN();if(p==='prompts')rP();if(p==='dashboard')uI()}
  document.querySelectorAll('#headerNav button,.sidebar-item[data-page]').forEach(function(x){x.addEventListener('click',function(){nav(x.dataset.page)})});
  setInterval(function(){var n=new Date();document.getElementById('clockDisplay').textContent=n.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);
  !function(){var h=(new Date()).getHours(),g=h<6?'夜深了':h<9?'早安':h<12?'上午好':h<14?'中午好':h<18?'下午好':'晚上好';document.getElementById('greeting').textContent=g+'，今天要加油!'}();
  function uI(){var p=D.tasks.filter(function(t){return !t.done}).length,td=D.tasks.filter(function(t){return t.done&&iT(t.doneAt)}).length;document.getElementById('statPending').textContent=p;document.getElementById('statDone').textContent=td;document.getElementById('statNotes').textContent=D.notes.length;document.getElementById('statFocus').textContent=D.focusCount;document.getElementById('taskBadge').textContent=p;var q=document.getElementById('quickNotesList');if(D.quickNotes.length===0){q.innerHTML='<div style="color:var(--ink-muted);font-size:13px;text-align:center;padding:12px">暂无备忘</div>'}else{q.innerHTML=D.quickNotes.slice().reverse().slice(0,5).map(function(n){return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--accent);font-size:10px">\u25cf</span><span style="flex:1">'+eH(n)+'</span><span style="color:var(--ink-muted);font-size:11px;cursor:pointer" onclick="dQN(\''+eH(n).replace(/'/g,"\\'")+'\')">\u2715</span></div>'}).join('')}uTD()}
  function uTD(){var m=Math.floor(tR/60),s=tR%60,e=document.getElementById('dashTimer');if(e)e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
  document.getElementById('quickNoteBtn').addEventListener('click',function(){var i=document.getElementById('quickNoteInput'),v=i.value.trim();if(!v)return;D.quickNotes.push(v);if(D.quickNotes.length>50)D.quickNotes.shift();i.value='';sv();uI()});
  window.dQN=function(t){D.quickNotes=D.quickNotes.filter(function(n){return n!==t});sv();uI()};
  function iT(ts){return ts?new Date(ts).toDateString()===new Date().toDateString():false}
  function eH(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  document.getElementById('dashTimerBtn').addEventListener('click',function(){nav('timer')});

  function rT(){var l=document.getElementById('taskList'),i=D.tasks;if(tF==='pending')i=i.filter(function(t){return !t.done});if(tF==='done')i=i.filter(function(t){return t.done});if(i.length===0){l.innerHTML='<li class="todo-empty">空空如也</li>';return}l.innerHTML=i.map(function(t){var ri=D.tasks.indexOf(t);return '<li class="todo-item'+(t.done?' done':'')+'" data-idx="'+ri+'"><span class="cb">'+(t.done?'\u2713':'')+'</span><span class="todo-text">'+eH(t.text)+'</span><button class="del-btn">\u2715</button></li>'}).join('');l.querySelectorAll('.todo-item').forEach(function(el){el.addEventListener('click',function(e){var idx=parseInt(this.dataset.idx);if(e.target.classList.contains('del-btn')||e.target.closest('.del-btn')){D.tasks.splice(idx,1);sv();rT();return}D.tasks[idx].done=!D.tasks[idx].done;D.tasks[idx].doneAt=D.tasks[idx].done?Date.now():null;sv();rT()})})}
  document.getElementById('taskAddBtn').addEventListener('click',function(){var i=document.getElementById('taskInput'),v=i.value.trim();if(!v)return;D.tasks.push({text:v,done:false,doneAt:null,createdAt:Date.now()});i.value='';sv();rT()});
  document.querySelectorAll('#pageTasks [data-filter]').forEach(function(b){b.addEventListener('click',function(){tF=this.dataset.filter;rT()})});
  document.getElementById('clearDoneTasks').addEventListener('click',function(){D.tasks=D.tasks.filter(function(t){return !t.done});sv();rT()});

  function rN(){var l=document.getElementById('notesList');if(D.notes.length===0){l.innerHTML='<div style="color:var(--ink-muted);font-size:13px;padding:12px;text-align:center">暂无笔记</div>';return}l.innerHTML=D.notes.map(function(n){return '<div class="note-item'+(n.id===cN?' active':'')+'" data-id="'+n.id+'"><span>📄</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+eH(n.title)+'</span><span class="note-date">'+fD(n.updated)+'</span></div>'}).join('');l.querySelectorAll('.note-item').forEach(function(el){el.addEventListener('click',function(){sN(this.dataset.id)})})}
  function sN(id){cN=id;var n=D.notes.find(function(x){return x.id===id});if(!n)return;document.getElementById('noteContent').value=n.content;document.getElementById('noteInfo').textContent=n.title+' · '+fD(n.updated);rN()}

  var nST=null;document.getElementById('noteContent').addEventListener('input',function(){clearTimeout(nST);nST=setTimeout(function(){if(!cN)return;var n=D.notes.find(function(x){return x.id===cN});if(!n)return;var ta=document.getElementById('noteContent');n.content=ta.value;var f=n.content.split('\n')[0].replace(/^#+\s*/,'').trim();if(f)n.title=f.slice(0,40);n.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}document.getElementById('noteInfo').textContent=n.title+' · '+fD(n.updated)},500)});

  var PP=[{name:'代码审查',desc:'审查代码改动，发现潜在问题和改进建议',prompt:'请审查以下代码，检查:\n1. 潜在 bug 和安全问题\n2. 性能瓶颈\n3. 代码风格和可读性\n4. 改进建议\n\n```\n[粘贴代码]\n```',tags:['开发','代码'],tt:'green'},{name:'数据分析',desc:'对数据集进行探索性分析和可视化建议',prompt:'请分析以下数据，提供:\n1. 数据概览(缺失值、分布)\n2. 关键洞察和模式\n3. 可视化建议\n4. 后续分析方向\n\n数据:\n[粘贴数据]',tags:['分析','数据科学'],tt:'blue'},{name:'学术写作',desc:'润色论文段落，改进学术表达',prompt:'请润色以下学术段落，要求:\n1. 保持学术严谨性\n2. 改进句式流畅度\n3. 优化用词精准度\n4. 不改变原意\n\n原文:\n[粘贴段落]',tags:['学术','写作'],tt:'amber'},{name:'调试助手',desc:'分析错误日志，定位问题根源',prompt:'请分析以下错误日志，给出:\n1. 错误类型和位置\n2. 可能的原因\n3. 修复方案\n4. 预防措施\n\n```\n[粘贴错误日志]\n```',tags:['调试','开发'],tt:'purple'},{name:'架构设计',desc:'系统架构评审与改进建议',prompt:'请评估以下系统设计方案:\n1. 架构优缺点\n2. 可扩展性分析\n3. 潜在风险点\n4. 改进建议\n\n设计:\n[描述你的架构]',tags:['架构','系统设计'],tt:'green'},{name:'Prompt 优化',desc:'优化你的 AI 提示词以获得更好结果',prompt:'请帮我优化以下提示词，使其更清晰、具体、有效:\n\n原始提示词:\n[粘贴提示词]\n\n请提供优化版本并说明改进原因。',tags:['AI','提示工程'],tt:'blue'},{name:'代码生成',desc:'根据需求生成高质量的代码实现',prompt:'请根据以下需求生成代码:\n\n需求描述:\n[描述你的需求]\n\n技术要求:\n- 语言:\n- 框架:\n- 性能要求:\n\n请包含必要的注释和错误处理。',tags:['开发','代码生成'],tt:'green'},{name:'学习规划',desc:'制定高效的学习路径和计划',prompt:'请帮我制定一个学习计划:\n\n目标:[想学什么]\n\n当前水平:[入门/中级/高级]\n\n时间:[每周可投入时间]\n\n请提供:\n1. 学习路径(分阶段)\n2. 推荐资源\n3. 每周计划\n4. 里程碑目标',tags:['学习','规划'],tt:'amber'},{name:'决策分析',desc:'多维度分析帮你做更好的决策',prompt:'请帮我分析以下决策:\n\n决策问题:[描述需要决定的事]\n\n可选方案:\n1. [方案A]\n2. [方案B]\n3. [方案C]\n\n请从以下维度分析:\n- 优势和劣势\n- 风险和收益\n- 短期 vs 长期影响\n- 推荐方案及理由',tags:['决策','思考'],tt:'purple'},{name:'思维导图',desc:'将复杂主题整理成结构化大纲',prompt:'请为主题 "[填写主题]" 生成一个结构化的大纲，格式如下:\n\n# [主题]\n## 1. [一级分类]\n### 1.1 [二级分类]\n- 关键点\n### 1.2 [二级分类]\n- 关键点\n## 2. [一级分类]\n...',tags:['思维','整理'],tt:'blue'}];

  function rP(){var g=document.getElementById('promptGrid');g.innerHTML=PP.map(function(p,i){return '<div class="prompt-card" data-idx="'+i+'"><div class="prompt-name">'+eH(p.name)+'</div><div class="prompt-desc">'+eH(p.desc)+'</div><div class="prompt-tags">'+p.tags.map(function(t){return '<span class="tag '+p.tt+'">'+t+'</span>'}).join('')+'</div></div>'}).join('');g.querySelectorAll('.prompt-card').forEach(function(el){el.addEventListener('click',function(){var idx=parseInt(this.dataset.idx),p=PP[idx],d=document.getElementById('promptDetail');d.innerHTML='<div class="prompt-detail"><strong style="font-size:15px">'+eH(p.name)+'</strong><p style="color:var(--ink-dim);font-size:13px;margin:4px 0 8px">'+eH(p.desc)+'</p><pre>'+eH(p.prompt)+'</pre><button class="copy-btn" onclick="cP('+idx+')">📋 复制到剪贴板</button></div>';d.scrollIntoView({behavior:'smooth',block:'nearest'})})})}
  window.cP=function(idx){navigator.clipboard.writeText(PP[idx].prompt).catch(function(){})};

  function uTD2(){var m=Math.floor(tR/60),s=tR%60;document.getElementById('timerDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('timerDisplay').className='timer-time'+(tR<=300?' amber':' accent');uTD()}
  function uTM(){var e=document.getElementById('timerMode');if(tRn&&tM==='focus')e.textContent='🍅 专注中';else if(tRn&&tM==='break')e.textContent='☕ 休息中';else if(!tRn&&tM==='focus')e.textContent='🍅 准备开始';else e.textContent='☕ 准备休息'}
  function tik(){if(tR<=0){clearInterval(tI);tI=null;tRn=false;if(tM==='focus'){D.focusCount++;D.focusDuration+=FM;sv();tM='break';tR=BM*60;document.getElementById('timerStartBtn').textContent='▶ 开始休息';try{new Notification('专注完成!',{body:'休息一下吧!'})}catch(e){}}else{tM='focus';tR=FM*60;document.getElementById('timerStartBtn').textContent='▶ 开始';try{new Notification('休息结束',{body:'开始新的专注!'})}catch(e){}}uTD2();uTM();uS();return}tR--;uTD2()}
  document.getElementById('timerStartBtn').addEventListener('click',function(){if(tRn){clearInterval(tI);tI=null;tRn=false;this.textContent='▶ 继续';return}tRn=true;this.textContent='⏸ 暂停';if(tM==='focus'&&tR===FM*60){D.focusDate=(new Date()).toDateString()}tI=setInterval(tik,1000);uTM()});
  document.getElementById('timerResetBtn').addEventListener('click',function(){clearInterval(tI);tI=null;tRn=false;tM='focus';tR=FM*60;document.getElementById('timerStartBtn').textContent='▶ 开始';uTD2();uTM();uS()});

  function fD(ts){var d=new Date(ts),n=new Date(),df=n-d;if(df<60000)return'刚刚';if(df<3600000)return Math.floor(df/60000)+'分钟前';if(d.toDateString()===n.toDateString())return'今天 '+d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});if(d.getFullYear()===n.getFullYear())return(d.getMonth()+1)+'月'+d.getDate()+'日';return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
  document.getElementById('sidebarReset').addEventListener('click',function(){if(!confirm('确认重置所有数据?此操作不可撤销!'))return;if(!confirm('真的吗?所有任务、笔记、计时数据都将被清除。'))return;localStorage.removeItem(K);D=fL();cN=null;tM='focus';tR=FM*60;if(tI){clearInterval(tI);tI=null;tRn=false}document.getElementById('timerStartBtn').textContent='▶ 开始';nav('dashboard');sv()});

  uI();uTD2();uTM();uS();
  window.addEventListener('beforeunload',function(){if(cN){var n=D.notes.find(function(x){return x.id===cN});if(n){n.content=document.getElementById('noteContent').value;n.updated=Date.now();localStorage.setItem(K,JSON.stringify(D))}}});
})();
